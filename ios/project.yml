# Generate the Xcode project with: brew install xcodegen && cd ios && xcodegen
name: RafiqAlbar
options:
  bundleIdPrefix: com.rasheedelaaj
  deploymentTarget:
    iOS: "16.0"
targets:
  RafiqAlbar:
    type: application
    platform: iOS
    sources: [RafiqAlbar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rasheedelaaj.rafiqalbar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: RafiqAlbar/Info.plist
      properties:
        CFBundleDisplayName: رفيق البر
        CFBundleDevelopmentRegion: ar
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSLocationWhenInUseUsageDescription: يحتاج التطبيق موقعك لحساب مواقيت الصلاة والقبلة والملاحة.
        NSMotionUsageDescription: يحتاج التطبيق حساس الحركة لتشغيل البوصلة.
        WKAppBoundDomains: [rasheedelaaj-svg.github.io]
